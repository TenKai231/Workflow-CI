name: Workflow CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mlflow-run:
    name: Run MLflow Project
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install MLflow
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn numpy

      - name: 🚀 Run MLflow Project
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          echo "Menjalankan MLflow Project dari folder MLProject..."
          # Menjalankan mlflow run pada direktori MLProject menggunakan environment local
          mlflow run MLProject/ --env-manager=local

      - name: ✅ Final Checks
        run: |
          echo "Workflow CI berhasil dieksekusi!"
