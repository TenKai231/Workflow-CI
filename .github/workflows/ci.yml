name: CI/CD Pipeline Credit Scoring

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test, and Train ML Model
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Membangun_model/requirements.txt

      - name: ⚙️ Run Preprocessing (Automate Script)
        run: |
          echo "Menjalankan pipeline preprocessing..."
          cd Eksperimen_SML_Rama/preprocessing/
          python automate_Rama.py
          echo "Preprocessing selesai!"

      - name: 🤖 Run Model Training (MLflow)
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          echo "Memulai pelatihan model menggunakan data yang sudah dibersihkan..."
          python Membangun_model/modelling.py

      - name: 🧪 Run Model Optimization (Hyperparameter Tuning)
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          echo "Menjalankan GridSearchCV optimization..."
          python Membangun_model/modelling_tuning.py

      - name: ✅ Final Checks
        run: |
          echo "Pipeline CI berhasil dieksekusi tanpa error!"
